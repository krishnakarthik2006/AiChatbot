<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus</title>
    <style>
        :root {
            --bg: #0d0f12;
            --surface: #15181d;
            --surface-strong: #1b2027;
            --surface-soft: #111419;
            --line: #2b323b;
            --line-strong: #3a4350;
            --text: #f4f7fb;
            --muted: #98a3b3;
            --accent: #4d8dff;
            --accent-strong: #2f6fe4;
            --accent-soft: #17325e;
            --success: #31c978;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            color: var(--text);
            font-family: "Segoe UI", Inter, Arial, sans-serif;
            background: var(--bg);
            overflow: hidden;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            border: 0;
        }

        .page-shell {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr);
            gap: 16px;
            padding: 16px;
            overflow: hidden;
        }

        .sidebar,
        .chat-panel {
            min-height: 0;
            min-width: 0;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 0;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 20px;
            overflow: hidden;
        }

        .brand-block {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--line);
        }

        .brand-mark {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            color: var(--text);
            background: var(--surface-strong);
            border: 1px solid var(--line-strong);
        }

        .brand-block h1,
        .panel-header h2 {
            margin: 0;
            font-size: 28px;
            line-height: 1.1;
            font-weight: 700;
            letter-spacing: 0;
        }

        .brand-block span,
        .history-heading,
        .history-empty,
        .message-meta,
        .empty-state {
            color: var(--muted);
        }

        .brand-block span {
            display: block;
            margin-top: 4px;
            font-size: 14px;
        }

        .sidebar-toolbar {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            padding-top: 4px;
            border-top: 1px solid var(--line);
        }

        .toolbar-icon {
            width: 40px;
            min-width: 40px;
            height: 40px;
            min-height: 40px;
            padding: 0;
        }

        .toolbar-icon.active {
            background: var(--accent-soft);
            border-color: #315483;
        }

        .history-section {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }

        .history-heading {
            margin: 0;
            padding-top: 10px;
            font-size: 12px;
            font-weight: 650;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .history-list {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 6px;
            min-height: 0;
            overflow: auto;
        }

        .history-empty {
            margin: 8px 0 0;
            font-size: 14px;
        }

        .history-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            width: 100%;
            padding: 10px 12px;
            color: var(--text);
            text-align: left;
            background: transparent;
            border: 1px solid transparent;
            cursor: pointer;
            transition: background 160ms ease, border-color 160ms ease;
        }

        .history-item:hover,
        .history-item.active {
            background: var(--surface-strong);
            border-color: var(--line);
        }

        .history-item.active {
            border-color: var(--line-strong);
        }

        .history-item-text {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .history-item-text strong {
            overflow: hidden;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-item-text small {
            color: var(--muted);
            font-size: 12px;
        }

        .settings-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 14px;
            background: var(--surface-soft);
            border: 1px solid var(--line);
        }

        .settings-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
            color: var(--muted);
        }

        .full-width {
            width: 100%;
        }

        .secondary-button,
        .primary-button,
        .icon-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            min-height: 46px;
            padding: 0 16px;
            border-radius: 0;
            cursor: pointer;
            color: var(--text);
            transition: border-color 160ms ease, background 160ms ease, opacity 160ms ease;
        }

        .secondary-button,
        .icon-button {
            background: var(--surface-strong);
            border: 1px solid var(--line);
        }

        .primary-button {
            background: var(--accent-strong);
            border: 1px solid var(--accent);
            font-weight: 650;
        }

        .secondary-button:hover,
        .icon-button:hover {
            background: #202631;
            border-color: var(--line-strong);
        }

        .primary-button:hover {
            background: #3679f0;
        }

        .secondary-button:disabled,
        .primary-button:disabled,
        .icon-button:disabled {
            opacity: 0.48;
            cursor: not-allowed;
        }

        .chat-panel {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            overflow: hidden;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-height: 76px;
            padding: 18px 24px;
            border-bottom: 1px solid var(--line);
            background: var(--surface);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            min-height: 36px;
            padding: 0 12px;
            color: var(--text);
            background: var(--surface-strong);
            border: 1px solid var(--line);
            font-size: 14px;
            font-weight: 650;
        }

        .status-pill.online {
            border-color: rgba(49, 201, 120, 0.45);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--muted);
        }

        .status-pill.online .status-dot {
            background: var(--success);
        }

        .messages-area {
            min-height: 0;
            padding: 24px;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
            background: var(--surface-soft);
        }

        .empty-state {
            margin: auto;
            font-size: 15px;
        }

        .message-row {
            display: flex;
            justify-content: flex-start;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-stack {
            width: min(760px, 82%);
        }

        .message-row.user .message-stack {
            width: min(560px, 78%);
        }

        .message-meta {
            margin-bottom: 7px;
            font-size: 13px;
        }

        .message-meta strong {
            color: var(--text);
            font-weight: 650;
        }

        .message-bubble {
            width: fit-content;
            max-width: 100%;
            padding: 14px 16px;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--line);
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message-row.user .message-bubble {
            margin-left: auto;
            background: var(--accent-soft);
            border-color: #315483;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 20px;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background: var(--muted);
            animation: typing 1s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.12s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.24s;
        }

        @keyframes typing {
            0%,
            100% {
                opacity: 0.45;
            }
            50% {
                opacity: 1;
            }
        }

        .composer {
            padding: 16px 24px;
            border-top: 1px solid var(--line);
            background: var(--surface);
        }

        .composer-controls {
            display: grid;
            grid-template-columns: 150px minmax(0, 1fr) 46px 112px;
            gap: 10px;
            align-items: center;
        }

        .select-field,
        .text-field {
            width: 100%;
            min-height: 46px;
            color: var(--text);
            background: var(--surface-strong);
            border: 1px solid var(--line);
            border-radius: 0;
            outline: none;
        }

        .select-field {
            padding: 0 12px;
        }

        .text-field {
            padding: 0 14px;
        }

        .select-field:focus,
        .text-field:focus,
        .secondary-button:focus-visible,
        .primary-button:focus-visible,
        .icon-button:focus-visible {
            border-color: var(--accent);
            outline: 2px solid rgba(77, 141, 255, 0.35);
            outline-offset: 2px;
        }

        .text-field::placeholder {
            color: #788394;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #3a414d;
        }

        @media (max-width: 980px) {
            body {
                overflow: auto;
            }

            .page-shell {
                grid-template-columns: 1fr;
                height: auto;
                min-height: 100%;
            }

            .sidebar {
                order: 2;
            }

            .chat-panel {
                min-height: calc(100vh - 32px);
            }
        }

        @media (max-width: 720px) {
            .page-shell {
                padding: 10px;
                gap: 10px;
            }

            .panel-header,
            .messages-area,
            .composer,
            .sidebar {
                padding-left: 16px;
                padding-right: 16px;
            }

            .composer-controls {
                grid-template-columns: 1fr 46px;
            }

            .text-field {
                grid-column: 1 / -1;
                grid-row: 1;
            }

            .message-stack,
            .message-row.user .message-stack {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <aside class="sidebar" aria-label="Workspace">
            <div class="brand-block">
                <div class="brand-mark">AI</div>
                <div>
                    <h1>Nexus</h1>
                    <span>Local AI</span>
                </div>
            </div>

            <div class="sidebar-toolbar">
                <button type="button" class="icon-button toolbar-icon" aria-label="Profile" title="Profile">U</button>
                <button type="button" class="icon-button toolbar-icon" id="settingsButton" aria-label="Settings" title="Settings">S</button>
            </div>

            <div class="settings-panel" id="settingsPanel" hidden role="region" aria-label="Settings">
                <label class="settings-field">
                    <span>Response mode</span>
                    <select class="select-field" id="settingsModeSelect" aria-label="Response mode">
                        <option value="balanced">Balanced</option>
                        <option value="precise">Precise</option>
                        <option value="creative">Creative</option>
                    </select>
                </label>
            </div>

            <section class="history-section" aria-label="Chat history">
                <h2 class="history-heading">Chat history</h2>
                <div class="history-list" id="historyList">
                    <p class="history-empty" id="historyEmpty">No previous chats yet</p>
                </div>
            </section>

            <button class="secondary-button full-width" id="newChatButton" type="button">New chat</button>
        </aside>

        <main class="chat-panel">
            <header class="panel-header">
                <h2>Chat</h2>
                <div class="status-pill" id="statusPill">
                    <span class="status-dot"></span>
                    <span id="connectionStatus">Connecting</span>
                </div>
            </header>

            <section class="messages-area" id="chatArea" aria-live="polite">
                <div class="empty-state" id="emptyState">Start a conversation</div>
            </section>

            <footer class="composer">
                <div class="composer-controls">
                    <select class="select-field" id="modeSelect" aria-label="Response mode">
                        <option value="balanced">Balanced</option>
                        <option value="precise">Precise</option>
                        <option value="creative">Creative</option>
                    </select>
                    <input class="text-field" id="messageInput" type="text" placeholder="Type a message..." aria-label="Message">
                    <button class="icon-button" id="resetButton" type="button" aria-label="Reset conversation" title="Reset conversation">R</button>
                    <button class="primary-button" id="sendButton" type="button">Send</button>
                </div>
                <div class="sr-only" id="screenReaderStatus" aria-live="polite">Checking backend</div>
            </footer>
        </main>
    </div>

    <script>
        const CHAT_HISTORY_KEY = 'nexus_chat_history';

        const state = {
            sessionId: '',
            isLoading: false,
            chatHistory: [],
            activeHistoryId: null,
            messages: [],
        };

        const chatArea = document.getElementById('chatArea');
        const emptyState = document.getElementById('emptyState');
        const input = document.getElementById('messageInput');
        const modeSelect = document.getElementById('modeSelect');
        const settingsModeSelect = document.getElementById('settingsModeSelect');
        const sendButton = document.getElementById('sendButton');
        const resetButton = document.getElementById('resetButton');
        const newChatButton = document.getElementById('newChatButton');
        const historyList = document.getElementById('historyList');
        const historyEmpty = document.getElementById('historyEmpty');
        const settingsButton = document.getElementById('settingsButton');
        const settingsPanel = document.getElementById('settingsPanel');
        const statusPill = document.getElementById('statusPill');
        const connectionStatus = document.getElementById('connectionStatus');
        const screenReaderStatus = document.getElementById('screenReaderStatus');

        function loadStoredChatHistory() {
            try {
                const stored = localStorage.getItem(CHAT_HISTORY_KEY);
                return stored ? JSON.parse(stored) : [];
            } catch (error) {
                return [];
            }
        }

        function persistChatHistory(entries) {
            state.chatHistory = entries;
            localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(entries));
            renderChatHistory();
        }

        function formatHistoryDate(isoDate) {
            if (!isoDate) return '';
            const date = new Date(isoDate);
            const now = new Date();
            const isToday = date.toDateString() === now.toDateString();
            return isToday
                ? date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
                : date.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        function renderChatHistory() {
            historyList.querySelectorAll('.history-item').forEach((node) => node.remove());

            if (!state.activeHistoryId && state.messages.length > 0) {
                const currentButton = document.createElement('button');
                currentButton.type = 'button';
                currentButton.className = 'history-item active';
                currentButton.innerHTML = '<span class="history-item-text"><strong>Current chat</strong><small>Active</small></span>';
                currentButton.addEventListener('click', () => {
                    state.activeHistoryId = null;
                    renderChatHistory();
                });
                historyList.appendChild(currentButton);
            }

            state.chatHistory.forEach((chat) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `history-item${state.activeHistoryId === chat.id ? ' active' : ''}`;
                button.innerHTML = `<span class="history-item-text"><strong>${chat.title}</strong><small>${formatHistoryDate(chat.updatedAt)}</small></span>`;
                button.addEventListener('click', () => loadHistoryChat(chat));
                historyList.appendChild(button);
            });

            historyEmpty.hidden = state.chatHistory.length > 0 || (!state.activeHistoryId && state.messages.length > 0);
        }

        function saveCurrentToHistory() {
            if (state.messages.length === 0) return;

            const firstUserMessage = state.messages.find((message) => message.sender === 'user');
            const title = firstUserMessage?.text?.trim().slice(0, 48) || 'New conversation';
            const entry = {
                id: state.sessionId || `chat-${Date.now()}`,
                title,
                messages: [...state.messages],
                updatedAt: new Date().toISOString(),
            };

            const nextHistory = [entry, ...state.chatHistory.filter((chat) => chat.id !== entry.id)].slice(0, 30);
            persistChatHistory(nextHistory);
        }

        function loadHistoryChat(chat) {
            state.activeHistoryId = chat.id;
            state.messages = [...chat.messages];
            clearMessages();
            chat.messages.forEach((message) => appendMessage(message.sender, message.text, false));
            settingsPanel.hidden = true;
            settingsButton.classList.remove('active');
            renderChatHistory();
            setStatus('Viewing saved chat', true);
        }

        function setStatus(label, ready) {
            connectionStatus.textContent = label;
            screenReaderStatus.textContent = label;
            statusPill.classList.toggle('online', ready);
        }

        function setLoading(isLoading) {
            state.isLoading = isLoading;
            sendButton.disabled = isLoading || !input.value.trim() || !state.sessionId;
            resetButton.disabled = isLoading;
            newChatButton.disabled = isLoading;
            input.disabled = isLoading;
        }

        function updateSendState() {
            sendButton.disabled = state.isLoading || !input.value.trim() || !state.sessionId;
        }

        function clearMessages() {
            [...chatArea.querySelectorAll('.message-row')].forEach((node) => node.remove());
            emptyState.hidden = false;
        }

        function appendMessage(sender, text, track = true) {
            emptyState.hidden = true;
            if (track) {
                state.messages.push({ sender, text });
            }

            const row = document.createElement('article');
            row.className = `message-row ${sender}`;

            const stack = document.createElement('div');
            stack.className = 'message-stack';

            const meta = document.createElement('div');
            meta.className = 'message-meta';
            const label = document.createElement('strong');
            label.textContent = sender === 'user' ? 'You' : 'Nexus';
            meta.appendChild(label);

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;

            stack.appendChild(meta);
            stack.appendChild(bubble);
            row.appendChild(stack);
            chatArea.appendChild(row);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function appendTyping() {
            emptyState.hidden = true;
            const row = document.createElement('article');
            row.className = 'message-row bot';
            row.id = 'typingIndicator';
            row.innerHTML = '<div class="message-stack"><div class="message-meta"><strong>Nexus</strong></div><div class="message-bubble"><div class="typing-indicator"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div></div></div>';
            chatArea.appendChild(row);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function removeTyping() {
            document.getElementById('typingIndicator')?.remove();
        }

        async function loadHealth() {
            try {
                const response = await fetch('/api/health', { credentials: 'include' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                await response.json();
                setStatus('Ready', true);
            } catch (error) {
                setStatus('Connecting', false);
            }
        }

        async function loadSession() {
            try {
                const response = await fetch('/api/session', { credentials: 'include' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                state.sessionId = data.session_id || '';
                state.activeHistoryId = null;
                state.messages = [];
                clearMessages();
                (data.history || []).forEach((message) => appendMessage(message.sender, message.text));
                renderChatHistory();
                updateSendState();
            } catch (error) {
                setStatus('Database error', false);
            }
        }

        async function resetChat() {
            if (state.isLoading) return;
            saveCurrentToHistory();
            setLoading(true);
            setStatus('Resetting', false);

            try {
                const response = await fetch('/api/session', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: state.sessionId }),
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                state.sessionId = data.session_id || '';
                state.activeHistoryId = null;
                state.messages = [];
                clearMessages();
                renderChatHistory();
                setStatus('Ready', true);
            } catch (error) {
                setStatus('Reset failed', false);
            } finally {
                setLoading(false);
                updateSendState();
            }
        }

        async function sendMessage() {
            const message = input.value.trim();
            if (!message || state.isLoading || !state.sessionId) return;

            if (state.activeHistoryId) {
                state.activeHistoryId = null;
                renderChatHistory();
            }

            appendMessage('user', message);
            input.value = '';
            setLoading(true);
            setStatus('Thinking', false);
            appendTyping();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: state.sessionId,
                        message,
                        mode: modeSelect.value,
                    }),
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                removeTyping();
                appendMessage('bot', data.response || '(No response generated)');
                setStatus('Ready', true);
            } catch (error) {
                removeTyping();
                appendMessage('bot', 'Unable to reach the backend. Check port 5000 and try again.');
                setStatus('Backend error', false);
            } finally {
                setLoading(false);
                updateSendState();
                renderChatHistory();
            }
        }

        settingsButton.addEventListener('click', () => {
            const isOpen = !settingsPanel.hidden;
            settingsPanel.hidden = isOpen;
            settingsButton.classList.toggle('active', !isOpen);
        });

        settingsModeSelect.addEventListener('change', (event) => {
            modeSelect.value = event.target.value;
        });

        modeSelect.addEventListener('change', (event) => {
            settingsModeSelect.value = event.target.value;
        });

        input.addEventListener('input', updateSendState);
        input.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault();
                sendMessage();
            }
        });
        sendButton.addEventListener('click', sendMessage);
        resetButton.addEventListener('click', resetChat);
        newChatButton.addEventListener('click', resetChat);

        state.chatHistory = loadStoredChatHistory();
        settingsModeSelect.value = modeSelect.value;
        setLoading(false);
        renderChatHistory();
        loadHealth();
        loadSession();
    </script>
</body>
</html>
